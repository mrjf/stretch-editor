[program:stretch-editor]
command=python3 system/services/oom_priority/bin/oom_tag_service.py user bash -c "python3 system/scripts/workspace_bare_scripts/venv_links.py ensure-project system/apps/stretch_editor && uv sync --locked --project system/apps/stretch_editor && python3 system/scripts/forward_port.py --manifest system/apps/stretch_editor/app.toml --url http://localhost:8080 && exec system/apps/stretch_editor/.venv/bin/stretch-editor"
directory=/home/user/workspace
autostart=true
autorestart=true
startsecs=30
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/stretch-editor-stdout.log
stderr_logfile=/var/log/supervisor/stretch-editor-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
